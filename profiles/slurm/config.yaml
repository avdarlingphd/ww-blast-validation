# Snakemake SLURM profile for FASRC / Cannon (HSPH allocation).
# Requires snakemake + snakemake-executor-plugin-slurm in the active env.
# Partition is hsph (lab policy) with sapphire,shared as fallbacks — SLURM runs each job on whichever
# listed partition can start it first. All three must be usable under slurm_account; verify with
# `sacctmgr -n show assoc user=$USER format=account,partition%20 | sort -u` before a real run.
executor: slurm
jobs: 200                      # max concurrently-submitted jobs (now ~250 blast_sample jobs + 250 extract)
default-resources:
  slurm_account: hhealy_lab
  slurm_partition: hsph,sapphire,shared
  mem_mb: 8000
  runtime: 120                 # minutes
set-resources:
  extract_sample:              # reads the ~5 GB .kraken + both FASTQs once per sample
    mem_mb: 16000
    runtime: 180
    cpus_per_task: 2
  blast_sample:                # ONE blastn vs nt over all the sample's tagged candidate reads
    mem_mb: 32000              # observed peak ~12 GB (one 39-taxid sample); 32 GB = headroom + schedules easily
    runtime: 720              # minutes; observed ~4 h for a 39-taxid sample, 12 h cap is safe
    cpus_per_task: 8
  classify:                    # parses every per-sample TSV; bigger than the old per-pair classify
    mem_mb: 16000
    runtime: 120
    cpus_per_task: 1
set-threads:
  blast_sample: 8
restart-times: 1
latency-wait: 60
rerun-incomplete: true
printshellcmds: true
